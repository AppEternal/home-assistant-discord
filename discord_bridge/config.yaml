name: Discord Bridge
version: "0.1.0"
slug: discord_bridge
description: Discord bot for button messages that trigger Home Assistant automations
url: https://github.com/AppEternal/home-assistant-discord
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:message-badge-outline
panel_title: Discord Bridge
map:
  - type: app_config
    read_only: false
options:
  bot_token: ""
  default_channel_id: ""
  auto_ack_seconds: 2.0
  auto_ack_type: defer_update
  allowed_user_ids: []
  log_level: info
schema:
  bot_token: password
  default_channel_id: str?
  auto_ack_seconds: float(0.5,2.8)
  auto_ack_type: list(defer_update|defer_reply|defer_reply_ephemeral)
  allowed_user_ids:
    - str
  log_level: list(debug|info|warning|error)
